# Site Settings
lang: pt-BR
timezone: America/La_Paz

# Site Information
title: Sergio Carvalho Queiroz Blog
tagline: Insights sobre Dados, Analytics e Transformação Digital
description: >-
  Blog profissional de Sergio Carvalho Queiroz compartilhando conhecimento sobre
  Data Analytics, Business Intelligence, Transformação Digital, Microsoft Fabric,
  Power BI, DataOps e Governança de Dados no setor de saúde.

# Site URL
url: "https://queirozsc.github.io"
baseurl: "/blog"

# Author Information
social:
  name: Sergio Carvalho Queiroz
  email: queirozsc@gmail.com
  links:
    - https://www.linkedin.com/in/queirozsc/

# Google Analytics
google_analytics:
  id: # Adicione seu ID do Google Analytics aqui (ex: G-XXXXXXXXXX)

# Theme Settings
theme: jekyll-theme-chirpy

# Chirpy Theme Options
img_cdn:

avatar: /assets/img/avatar.png

# Table of Contents
toc: true

# Comments
comments:
  active: # giscus, disqus, utterances
  
# Self-hosted static assets
assets:
  self_host:
    enabled: false

# PWA (Progressive Web App)
pwa:
  enabled: true
  cache:
    enabled: true

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Sass/SCSS
sass:
  style: compressed

# Exclude files
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - rollup.config.js
  - package*.json

# Jekyll Compose
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-feed
